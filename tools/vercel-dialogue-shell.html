<body>
  <div id="nekogpt-connect-splash" role="button" tabindex="0" aria-label="Entrar no NekoGPT Connect"></div>
  <div id="root"></div>
  <script>
  (()=>{
    const splash=document.getElementById('nekogpt-connect-splash');
    if(!splash)return;
    let entered=false;
    const enter=()=>{if(entered)return;entered=true;splash.remove()};
    splash.addEventListener('click',enter,{once:true});
    splash.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();enter()}},{once:true});
  })();
  </script>
  <div class="live2d-switch-mask" aria-live="polite" aria-label="Trocando de modelo"><span class="live2d-switch-mask__spinner" aria-hidden="true"></span><span>Trocando de modelo</span></div>
  <script>
  (()=>{
    window.__NEKOGPT_PROD_SHELL_MODEL_SYNC__=true;
    const HUD='https://nekogpt-mobile-p3wp6go4o-inobushi3s-projects.vercel.app';
    const DEFAULT_CONTEXT_CHARS=32000,LM_STUDIO_CONTEXT_CHARS=14000,OVERHEAD=16,IMG=360,PDF=1200,FILE=520;
    const MODEL_IDENTITY_KEY='nekogpt:live2d-model-identity-v22';
    const MODEL_SWITCH_GUARD_KEY='nekogpt:live2d-model-switch-guard-v22';
    const MODEL_SWITCH_GUARD_MS=12000;
    const pending=new Map();
    let history=[],contextLimitChars=DEFAULT_CONTEXT_CHARS;
    let relaySocket=null,pairApproved=false;
    let activeModelIdentity='',candidateModelIdentity='',candidateModelHits=0,reloadingForModel=false;
    let modelSwitchGuard=null;
    try{activeModelIdentity=sessionStorage.getItem(MODEL_IDENTITY_KEY)||''}catch{}
    try{modelSwitchGuard=JSON.parse(sessionStorage.getItem(MODEL_SWITCH_GUARD_KEY)||'null')}catch{modelSwitchGuard=null}
    const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
    const clamp=v=>Math.max(0,Math.min(100,v));
    const identityOf=(modelId,modelFile)=>`${clean(modelId)}\u0000${clean(modelFile)}`;
    const persistActiveModel=value=>{activeModelIdentity=value;try{sessionStorage.setItem(MODEL_IDENTITY_KEY,value)}catch{}};
    const persistModelGuard=value=>{modelSwitchGuard=value;try{value?sessionStorage.setItem(MODEL_SWITCH_GUARD_KEY,JSON.stringify(value)):sessionStorage.removeItem(MODEL_SWITCH_GUARD_KEY)}catch{}};
    const resetCandidate=()=>{candidateModelIdentity='';candidateModelHits=0};
    const isStalePreviousModel=next=>{
      const guard=modelSwitchGuard;
      if(!guard||typeof guard!=='object')return false;
      const until=Number(guard.until)||0;
      if(Date.now()>=until){persistModelGuard(null);return false}
      return next===clean(guard.from);
    };
    const attachmentChars=a=>{const text=clean(a?.text);if(text)return text.length+OVERHEAD;const mime=clean(a?.mimeType).toLowerCase();if(mime.startsWith('image/'))return IMG;if(mime==='application/pdf')return PDF;return FILE};
    function ensure(){
      const s=document.querySelector('.companion-screen');if(!s)return null;
      let g=s.querySelector('.relationship-gauge');
      if(!g){g=document.createElement('div');g.className='relationship-gauge';g.setAttribute('role','img');g.innerHTML=`<span class="relationship-gauge__track"><img class="relationship-gauge__base" src="${HUD}/gauge-base.png" alt=""><span class="relationship-gauge__fill"><img src="${HUD}/gauge-active-01.png" alt=""></span></span><img class="relationship-gauge__heart" src="${HUD}/hp-icon-base.png" alt="">`;s.appendChild(g)}
      if(!s.querySelector('.mic-trigger')){const b=document.createElement('button');b.className='mic-trigger';b.type='button';b.innerHTML='<svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>';b.onclick=()=>{const src=document.querySelector('.floating-composer .control-mic-button');if(!src)return;src.classList.remove('control-mic-button');try{src.click()}finally{src.classList.add('control-mic-button')}};s.appendChild(b)}
      const src=document.querySelector('.floating-composer .control-mic-button'),b=s.querySelector('.mic-trigger');if(b)b.classList.toggle('is-ready',!!src?.classList.contains('is-active'));
      return g;
    }
    function normalizeHistory(value){const src=value&&typeof value==='object'?value:{};const list=Array.isArray(src.messages)?src.messages:[];return list.map(m=>{if(!m||typeof m!=='object')return null;const role=m.role==='assistant'?'assistant':m.role==='user'?'user':null,content=clean(m.content);if(!role||!content)return null;return{role,content,attachments:Array.isArray(m.attachments)?m.attachments:[]}}).filter(Boolean)}
