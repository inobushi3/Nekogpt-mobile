  <body>
    <div id="root"></div>
    <script>
      (()=>{
        const SPEED_STORAGE_KEY='nekogpt:dialogue-text-speed';
        const BASE_CHARACTERS_PER_SECOND=18;
        const SPEED_VALUES=[1,2,3];
        let speed=readSavedSpeed();
        let animateAfter=performance.now()+1400;
        const animatedRows=new WeakSet();
        const activeFrames=new WeakMap();
        function readSavedSpeed(){try{const value=Number(localStorage.getItem(SPEED_STORAGE_KEY));return SPEED_VALUES.includes(value)?value:1}catch{return 1}}
        function saveSpeed(value){try{localStorage.setItem(SPEED_STORAGE_KEY,String(value))}catch{}}
        function nextSpeed(value){return value===1?2:value===2?3:1}
        function speedAriaLabel(value=speed){const language=document.documentElement.lang.toLowerCase();if(language.startsWith('pt'))return `Velocidade do texto: ${value}x. Toque para alterar.`;if(language.startsWith('es'))return `Velocidad del texto: ${value}x. Toca para cambiar.`;return `Text speed: ${value}x. Tap to change.`}
        function syncSpeedButton(){const button=document.querySelector('.floating-composer .control-mic-button');if(!button)return;button.dataset.speedLabel=`×${speed}`;button.dataset.dialogueSpeed=String(speed);button.setAttribute('aria-label',speedAriaLabel());button.setAttribute('title',speedAriaLabel());button.setAttribute('aria-pressed','false')}
        function splitGraphemes(text){if(typeof Intl!=='undefined'&&'Segmenter'in Intl){const Segmenter=Intl.Segmenter;if(Segmenter){const segmenter=new Segmenter(undefined,{granularity:'grapheme'});return Array.from(segmenter.segment(text),entry=>entry.segment)}}return Array.from(text)}
        function renderRevealedText(spans,sets,revealed){let remaining=revealed;for(let i=0;i<spans.length;i+=1){const chars=sets[i];const count=Math.max(0,Math.min(chars.length,remaining));spans[i].textContent=chars.slice(0,count).join('');remaining-=count}}
        function finishRow(row,spans,sets){renderRevealedText(spans,sets,sets.reduce((sum,chars)=>sum+chars.length,0));row.removeAttribute('aria-busy');row.classList.remove('is-dialogue-typing');activeFrames.delete(row)}
        function animateRow(row){if(animatedRows.has(row)||row.closest('.history-overlay'))return;const spans=Array.from(row.querySelectorAll('.app-message-content'));if(!spans.length)return;animatedRows.add(row);const sets=spans.map(span=>splitGraphemes(span.textContent||''));const total=sets.reduce((sum,chars)=>sum+chars.length,0);if(!total||matchMedia('(prefers-reduced-motion: reduce)').matches)return;row.setAttribute('aria-busy','true');row.classList.add('is-dialogue-typing');renderRevealedText(spans,sets,0);let revealed=0,carry=0,previous=performance.now();const step=now=>{const delta=Math.min(80,Math.max(0,now-previous));previous=now;carry+=(delta*BASE_CHARACTERS_PER_SECOND*speed)/1000;const increment=Math.floor(carry);if(increment>0){carry-=increment;revealed=Math.min(total,revealed+increment);renderRevealedText(spans,sets,revealed)}if(revealed>=total){finishRow(row,spans,sets);return}activeFrames.set(row,requestAnimationFrame(step))};activeFrames.set(row,requestAnimationFrame(step))}
        function processRow(row){if(performance.now()<animateAfter){animatedRows.add(row);return}animateRow(row)}
        function processAdded(node){if(!(node instanceof HTMLElement))return;if(node.matches('.floating-messages .app-message-line--assistant'))processRow(node);node.querySelectorAll('.floating-messages .app-message-line--assistant').forEach(processRow);if(node.matches('.control-mic-button')||node.querySelector('.control-mic-button'))syncSpeedButton()}
        document.querySelectorAll('.floating-messages .app-message-line--assistant').forEach(row=>animatedRows.add(row));
        document.addEventListener('click',event=>{const target=event.target instanceof Element?event.target.closest('.floating-composer .control-mic-button'):null;if(!target)return;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();speed=nextSpeed(speed);saveSpeed(speed);syncSpeedButton();target.animate([{transform:'scale(1)'},{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:160,easing:'ease-out'})},true);
        const observer=new MutationObserver(mutations=>{for(const mutation of mutations)mutation.addedNodes.forEach(processAdded);syncSpeedButton()});observer.observe(document.body,{childList:true,subtree:true});syncSpeedButton();
      })();
    </script>
