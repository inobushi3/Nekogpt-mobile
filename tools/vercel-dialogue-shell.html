  <script>
  (()=>{
    const HUD='https://nekogpt-mobile-p3wp6go4o-inobushi3s-projects.vercel.app';
    const CONTEXT_LIMIT_CHARS=8000*4,OVERHEAD=16,IMG=360,PDF=1200,FILE=520;

    let relaySocket=null,pairApproved=false;
    let live2dModelIdentity='',live2dRefreshing=false,live2dLoadingTimer=0;

    function ensure(){

      const src=document.querySelector('.floating-composer .control-mic-button'),b=s.querySelector('.mic-trigger');if(b)b.classList.toggle('is-ready',!!src?.classList.contains('is-active'));

    function normalizeHistory(value){const src=value&&typeof value==='object'?value:{};const list=Array.isArray(src.messages)?src.messages:[];return list.map(m=>{if(!m||typeof m!=='object')return null;const role=m.role==='assistant'?'assistant':m.role==='user'?'user':null,content=clean(m.content);if(!role||!content)return null;return{role,content,attachments:Array.isArray(m.attachments)?m.attachments:[]}}).filter(Boolean)}
    function draftChars(){const field=document.querySelector('.floating-composer textarea,.floating-composer input[type="text"],.floating-composer [contenteditable="true"]');const value=field?.value??field?.textContent??'';const text=clean(value);let chars=text?text.length+OVERHEAD:0;if(document.querySelector('.floating-composer .media-preview-strip img,.floating-composer .media-preview-strip video'))chars+=IMG;return chars}

    function collectHooks(fiber){const hooks=[];let hook=fiber?.memoizedState||null;while(hook&&hooks.length<48){hooks.push(hook);hook=hook.next||null}return hooks}
    function findBundleRefreshDispatch(){
      const root=document.getElementById('root');if(!root)return null;
      const key=Object.keys(root).find(k=>k.startsWith('__reactContainer$'));const rootFiber=key?root[key]:null;if(!rootFiber)return null;
      const stack=[rootFiber];

          const phase=hooks[3]?.memoizedState,version=hooks[28]?.memoizedState,dispatch=hooks[28]?.queue?.dispatch;

    }

    function watchLive2DLoading(){

    }

    }

      if(!message||typeof message!=='object')return;
      if(message.type==='pair.approved')pairApproved=true;

    function Wrapped(url,protocols){

      const send=ws.send;
      ws.send=function(data){try{const m=typeof data==='string'?JSON.parse(data):null;if(m?.type==='rpc.request'&&m.id&&m.method)pending.set(m.id,m.method)}catch{}return send.call(ws,data)};

    function pollLive2DSnapshot(){
      const ws=relaySocket;
      if(!pairApproved||!ws||ws.readyState!==WebSocket.OPEN)return;
      const id=`mobile-live2d-sync-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
      try{ws.send(JSON.stringify({type:'rpc.request',id,method:'companion.snapshot'}))}catch{}
    }

  })();
