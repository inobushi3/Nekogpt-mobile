  <div id="root"></div>
  <div class="live2d-switch-mask" aria-live="polite" aria-label="Trocando de modelo"><span class="live2d-switch-mask__spinner" aria-hidden="true"></span><span>Trocando de modelo</span></div>
  <script>
  (()=>{
    window.__NEKOGPT_PROD_SHELL_MODEL_SYNC__=true;
    const HUD='https://nekogpt-mobile-p3wp6go4o-inobushi3s-projects.vercel.app';
    const DEFAULT_CONTEXT_CHARS=32000,LM_STUDIO_CONTEXT_CHARS=14000,OVERHEAD=16,IMG=360,PDF=1200,FILE=520;
    const MODEL_IDENTITY_KEY='nekogpt:live2d-model-identity-v22';
    const MODEL_SWITCH_GUARD_KEY='nekogpt:live2d-model-switch-guard-v22';
    const MODEL_SWITCH_GUARD_MS=12000;
    const pending=new Map();
    let history=[],contextLimitChars=DEFAULT_CONTEXT_CHARS;
    let relaySocket=null,pairApproved=false;
    let activeModelIdentity='',candidateModelIdentity='',candidateModelHits=0,reloadingForModel=false;
    let modelSwitchGuard=null;
    try{activeModelIdentity=sessionStorage.getItem(MODEL_IDENTITY_KEY)||''}catch{}
    try{modelSwitchGuard=JSON.parse(sessionStorage.getItem(MODEL_SWITCH_GUARD_KEY)||'null')}catch{modelSwitchGuard=null}
    const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
    const clamp=v=>Math.max(0,Math.min(100,v));
    const identityOf=(modelId,modelFile)=>`${clean(modelId)}\u0000${clean(modelFile)}`;
    const persistActiveModel=value=>{activeModelIdentity=value;try{sessionStorage.setItem(MODEL_IDENTITY_KEY,value)}catch{}};
    const persistModelGuard=value=>{modelSwitchGuard=value;try{value?sessionStorage.setItem(MODEL_SWITCH_GUARD_KEY,JSON.stringify(value)):sessionStorage.removeItem(MODEL_SWITCH_GUARD_KEY)}catch{}};
    const resetCandidate=()=>{candidateModelIdentity='';candidateModelHits=0};
    const isStalePreviousModel=next=>{
      const guard=modelSwitchGuard;
      if(!guard||typeof guard!=='object')return false;
      const until=Number(guard.until)||0;
      if(Date.now()>=until){persistModelGuard(null);return false}
      return next===clean(guard.from);
    };
    const attachmentChars=a=>{const text=clean(a?.text);if(text)return text.length+OVERHEAD;const mime=clean(a?.mimeType).toLowerCase();if(mime.startsWith('image/'))return IMG;if(mime==='application/pdf')return PDF;return FILE};
    function ensure(){
      const s=document.querySelector('.companion-screen');if(!s)return null;
      let g=s.querySelector('.relationship-gauge');
      if(!g){g=document.createElement('div');g.className='relationship-gauge';g.setAttribute('role','img');g.innerHTML=`<span class="relationship-gauge__track"><img class="relationship-gauge__base" src="${HUD}/gauge-base.png" alt=""><span class="relationship-gauge__fill"><img src="${HUD}/gauge-active-01.png" alt=""></span></span><img class="relationship-gauge__heart" src="${HUD}/hp-icon-base.png" alt="">`;s.appendChild(g)}
      if(!s.querySelector('.mic-trigger')){const b=document.createElement('button');b.className='mic-trigger';b.type='button';b.innerHTML='<svg viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>';b.onclick=()=>{const src=document.querySelector('.floating-composer .control-mic-button');if(!src)return;src.classList.remove('control-mic-button');try{src.click()}finally{src.classList.add('control-mic-button')}};s.appendChild(b)}
      const src=document.querySelector('.floating-composer .control-mic-button'),b=s.querySelector('.mic-trigger');if(b)b.classList.toggle('is-ready',!!src?.classList.contains('is-active'));
      return g;
    }
    function normalizeHistory(value){const src=value&&typeof value==='object'?value:{};const list=Array.isArray(src.messages)?src.messages:[];return list.map(m=>{if(!m||typeof m!=='object')return null;const role=m.role==='assistant'?'assistant':m.role==='user'?'user':null,content=clean(m.content);if(!role||!content)return null;return{role,content,attachments:Array.isArray(m.attachments)?m.attachments:[]}}).filter(Boolean)}
    function draftChars(){const field=document.querySelector('.floating-composer textarea,.floating-composer input[type="text"],.floating-composer [contenteditable="true"]');const value=field?.value??field?.textContent??'';const text=clean(value);let chars=text?text.length+OVERHEAD:0;if(document.querySelector('.floating-composer .media-preview-strip img,.floating-composer .media-preview-strip video'))chars+=IMG;return chars}
    function contextPercent(){const chars=history.reduce((sum,m)=>sum+m.content.length+OVERHEAD+m.attachments.reduce((n,a)=>n+attachmentChars(a),0),0)+draftChars();return clamp(chars/contextLimitChars*100)}
    function paint(){const g=ensure();if(!g)return;const p=contextPercent(),display=Math.round(p),fill=g.querySelector('.relationship-gauge__fill'),heart=g.querySelector('.relationship-gauge__heart');if(fill)fill.style.width=`${p>0?Math.max(1,1.88*p):0}px`;if(heart)heart.src=p>=99.999?`${HUD}/hp-icon-active.png`:`${HUD}/hp-icon-base.png`;g.dataset.percent=String(display);g.title=`Contexto do chat ${display}%`;g.setAttribute('aria-label',`Relacionamento · contexto do chat ${display}%`)}
    function acceptHistory(value){history=normalizeHistory(value);paint()}
    function showSwapMask(){document.querySelector('.live2d-switch-mask')?.classList.add('is-active')}
    function acceptSnapshot(value){
      const s=value&&typeof value==='object'?value:{};
      const provider=clean(s.provider);
      contextLimitChars=/lm\s*studio/i.test(provider)?LM_STUDIO_CONTEXT_CHARS:DEFAULT_CONTEXT_CHARS;
      paint();
      const modelId=clean(s.modelId),modelFile=clean(s.modelFile);if(!modelId||!modelFile||reloadingForModel)return;
      const next=identityOf(modelId,modelFile);
      if(!activeModelIdentity){persistActiveModel(next);resetCandidate();return}
      if(next===activeModelIdentity){resetCandidate();return}
      if(isStalePreviousModel(next)){resetCandidate();return}
      if(next!==candidateModelIdentity){candidateModelIdentity=next;candidateModelHits=1;return}
      candidateModelHits+=1;
      if(candidateModelHits<2)return;
      const previous=activeModelIdentity;
      persistActiveModel(next);
      persistModelGuard({from:previous,to:next,until:Date.now()+MODEL_SWITCH_GUARD_MS});
      resetCandidate();
      reloadingForModel=true;
      showSwapMask();
      window.setTimeout(()=>window.location.reload(),180);
    }
    function requestSync(method){
      const ws=relaySocket;if(!pairApproved||!ws||ws.readyState!==WebSocket.OPEN)return;
      const id=`mobile-shell-sync-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
      pending.set(id,method);
      try{ws.send(JSON.stringify({type:'rpc.request',id,method}))}catch{pending.delete(id)}
    }
    function incoming(message){
      if(!message||typeof message!=='object')return;
      if(message.type==='pair.approved'){
        pairApproved=true;
        window.setTimeout(()=>{requestSync('companion.chat.history');requestSync('companion.snapshot')},80);
      }
      if(message.type==='relay.peer.left'&&message.role==='desktop')pairApproved=false;
      if(message.type==='companion.snapshot'||message.type==='companion.snapshot.updated')acceptSnapshot(message.payload);
      if(message.type==='chat.history'){acceptHistory(message.payload);return}
      if(message.type!=='rpc.response'||!message.id)return;
      const method=pending.get(message.id);if(!method)return;pending.delete(message.id);if(!message.ok)return;
      if(method==='companion.snapshot')acceptSnapshot(message.result);
      else if(method==='companion.chat.history')acceptHistory(message.result);
      else if(method==='chat.send'&&message.result?.history)acceptHistory(message.result.history)
    }
    const Native=window.WebSocket;
    function Wrapped(url,protocols){
      const ws=protocols===undefined?new Native(url):new Native(url,protocols);
      if(/(?:\?|&)role=mobile(?:&|$)/.test(String(url)))relaySocket=ws;
      const send=ws.send;
      ws.send=function(data){try{const m=typeof data==='string'?JSON.parse(data):null;if(m?.type==='rpc.request'&&m.id&&m.method)pending.set(m.id,m.method)}catch{}return send.call(ws,data)};
      ws.addEventListener('message',e=>{if(typeof e.data!=='string')return;try{incoming(JSON.parse(e.data))}catch{}});
      ws.addEventListener('close',()=>{if(relaySocket===ws){relaySocket=null;pairApproved=false}});
      return ws
    }
    Wrapped.prototype=Native.prototype;Object.defineProperties(Wrapped,{CONNECTING:{value:Native.CONNECTING},OPEN:{value:Native.OPEN},CLOSING:{value:Native.CLOSING},CLOSED:{value:Native.CLOSED}});window.WebSocket=Wrapped;
    document.addEventListener('input',e=>{if(e.target?.closest?.('.floating-composer'))paint()},true);
    setInterval(paint,400);
    setTimeout(paint,0);
  })();
  </script>
