name: Build production frontend bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/nekogpt-single.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nekogpt-production-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npx vite build

      - name: Create self-contained HTML
        run: node scripts/build-singlefile.mjs

      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deploy/nekogpt-single.html
          if git diff --cached --quiet; then
            echo "Production bundle is already current."
            exit 0
          fi
          git commit -m "Build production frontend bundle [skip ci]"
          git push
