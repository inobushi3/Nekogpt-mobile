name: Add NekoGPT Connect entry splash

on:
  push:
    paths:
      - '.github/workflows/add-connect-splash-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add click-to-enter splash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('tools/vercel-dialogue-shell.html')
          text = path.read_text()
          splash = ''''''

          if 'nekogpt-connect-splash' in text:
              raise SystemExit('Splash already exists')

          text = text.replace(
              'data-revision="flat-glass-send-v23-20260907"',
              'data-revision="connect-splash-v24-20260907"',
              1,
          )

          css = f'''\n    #nekogpt-connect-splash{{position:fixed;inset:0;z-index:2147483646;background:#000 url("data:image/webp;base64,{splash}") center center/cover no-repeat;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none}}\n    #nekogpt-connect-splash:focus{{outline:none}}\n'''
          text = text.replace('  </style>', css + '  </style>', 1)

          splash_html = '''  <div id="nekogpt-connect-splash" role="button" tabindex="0" aria-label="Entrar no NekoGPT Connect"></div>\n'''
          text = text.replace('  <div id="root"></div>\n', splash_html + '  <div id="root"></div>\n', 1)

          splash_script = '''  <script>\n  (()=>{\n    const splash=document.getElementById('nekogpt-connect-splash');\n    if(!splash)return;\n    let entered=false;\n    const enter=()=>{if(entered)return;entered=true;splash.remove()};\n    splash.addEventListener('click',enter,{once:true});\n    splash.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();enter()}},{once:true});\n  })();\n  </script>\n'''
          text = text.replace(splash_html + '  <div id="root"></div>\n', splash_html + '  <div id="root"></div>\n' + splash_script, 1)

          path.write_text(text)
          PY

      - name: Commit splash screen
        run: |
          git config user.name "NekoGPT Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/vercel-dialogue-shell.html
          git commit -m "feat(mobile): add click-to-enter connect splash"
          git push
