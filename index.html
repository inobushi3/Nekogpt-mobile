    <style>
      .floating-composer .control-mic-button {
        display: none !important;
      }

      .floating-composer .composer-field {
        width: 100% !important;
        margin-left: 0 !important;
        border-color: rgba(255, 246, 231, 0.92) !important;
      }

      .floating-composer .media-preview-strip {
        left: 0 !important;

      /* Ready = flat cream. Empty = milky transparent glass like the reference HUD buttons. */
      .floating-composer .send-paw-button,
      .floating-composer .send-paw-button:disabled {
        top: 50% !important;
        right: 6px !important;
        width: 50px !important;
        height: 50px !important;
        margin: 0 !important;
        display: grid !important;
        place-items: center !important;
        padding: 0 !important;
        overflow: hidden !important;
        border: 1px solid rgba(255, 250, 238, 0.94) !important;
        border-radius: 999px !important;
        background: #fff6e4 !important;
        box-shadow: none !important;
        color: #94546a !important;
        opacity: 1 !important;
        transform: translateY(-50%) !important;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease !important;
      }

      .floating-composer .send-paw-button .paw-icon {
        display: none !important;
      }

      /* Plain arrow glyph only: no square, circle, plate or fill behind it. */
      .floating-composer .send-paw-button::before {
        content: "↑" !important;
        display: block !important;
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        border: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        text-shadow: none !important;
        color: currentColor !important;
        font-family: "Segoe UI Symbol", "Arial Unicode MS", Arial, sans-serif !important;
        font-size: 35px !important;
        font-weight: 300 !important;
        line-height: 1 !important;
        transform: translateY(-1px) !important;
      }

      .floating-composer .send-paw-button::after {
        display: none !important;
      }

      .floating-composer .send-paw-button:active:not(:disabled) {
        transform: translateY(-50%) !important;
      }

      .floating-composer .send-paw-button:disabled {
        border-color: rgba(255, 255, 255, 0.34) !important;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.10)) !important;
        -webkit-backdrop-filter: blur(11px) saturate(135%) !important;
        backdrop-filter: blur(11px) saturate(135%) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          inset 0 -1px 0 rgba(255, 255, 255, 0.07) !important;
        color: rgba(255, 255, 255, 0.82) !important;
      }

      .floating-composer .send-paw-button:disabled::before {
        background: transparent !important;
        color: rgba(255, 255, 255, 0.82) !important;
      }

        .floating-composer .send-paw-button,
        .floating-composer .send-paw-button:disabled {

          width: 48px !important;
          height: 48px !important;
        }

          font-size: 33px !important;
        }
