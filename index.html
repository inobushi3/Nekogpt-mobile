<!doctype html>
<html lang="pt-BR" data-revision="glass-send-v6-20260906">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d18" />
    <meta name="description" content="Controle remoto seguro do NekoGPT" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NekoGPT" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/nekogpt-favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nekogpt-favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/nekogpt-apple-touch-icon.png?v=2" />
    <title>NekoGPT Mobile</title>
    <script>
      try {
        localStorage.setItem('nekogpt:dialogue-text-speed', '2');
      } catch {}
    </script>
    <style>
      .floating-composer .control-mic-button {
        display: none !important;
      }

      .floating-composer .composer-field {
        width: 100% !important;
        margin-left: 0 !important;
        border-color: rgba(255, 246, 231, 0.92) !important;
      }

      .floating-composer .media-preview-strip {
        left: 0 !important;
      }

      /* Send button: ready = flat cream; disabled = iPhone-like frosted glass. */
      .floating-composer .send-paw-button,
      .floating-composer .send-paw-button:disabled {
        top: 50% !important;
        right: 6px !important;
        width: 50px !important;
        height: 50px !important;
        margin: 0 !important;
        display: grid !important;
        place-items: center !important;
        padding: 0 !important;
        position: absolute !important;
        overflow: hidden !important;
        border: 1px solid rgba(255, 250, 238, 0.94) !important;
        border-radius: 999px !important;
        background: #fff6e4 !important;
        box-shadow: none !important;
        color: #94546a !important;
        opacity: 1 !important;
        transform: translateY(-50%) !important;
        transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease !important;
      }

      .floating-composer .send-paw-button .paw-icon {
        display: none !important;
      }

      /* Outline-only arrow: no glyph box/fill behind it. */
      .floating-composer .send-paw-button::before {
        content: "" !important;
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        width: 2px !important;
        height: 22px !important;
        margin: 0 !important;
        border: 0 !important;
        border-radius: 999px !important;
        background: currentColor !important;
        box-shadow: none !important;
        transform: translate(-50%, -36%) !important;
      }

      .floating-composer .send-paw-button::after {
        content: "" !important;
        position: absolute !important;
        left: 50% !important;
        top: 11px !important;
        width: 11px !important;
        height: 11px !important;
        margin: 0 !important;
        border: 0 !important;
        border-left: 2px solid currentColor !important;
        border-top: 2px solid currentColor !important;
        background: transparent !important;
        box-shadow: none !important;
        transform: translateX(-50%) rotate(45deg) !important;
      }

      .floating-composer .send-paw-button:active:not(:disabled) {
        transform: translateY(-50%) !important;
      }

      .floating-composer .send-paw-button:disabled {
        border-color: rgba(255, 255, 255, 0.30) !important;
        background: rgba(255, 255, 255, 0.085) !important;
        -webkit-backdrop-filter: blur(18px) saturate(170%) !important;
        backdrop-filter: blur(18px) saturate(170%) !important;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.20),
          inset 0 -1px 0 rgba(255, 255, 255, 0.045),
          0 5px 18px rgba(0, 0, 0, 0.12) !important;
        color: rgba(255, 246, 231, 0.58) !important;
      }

      .floating-composer .send-paw-button:disabled::before {
        background: currentColor !important;
      }

      .floating-composer .send-paw-button:disabled::after {
        background: transparent !important;
      }

      @media (max-width: 620px) {
        .floating-composer .send-paw-button,
        .floating-composer .send-paw-button:disabled {
          right: 5px !important;
          width: 48px !important;
          height: 48px !important;
        }

        .floating-composer .send-paw-button::before {
          height: 21px !important;
        }

        .floating-composer .send-paw-button::after {
          top: 10px !important;
          width: 10px !important;
          height: 10px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
