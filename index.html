<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d18" />
    <meta name="description" content="Controle remoto seguro do NekoGPT" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NekoGPT" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/nekogpt-favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nekogpt-favicon-192.png?v=4" />
    <link rel="apple-touch-icon" href="/nekogpt-apple-touch-icon.png?v=4" />
    <title>NekoGPT Mobile</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // The uploaded night scene was accidentally committed as base64 text
      // inside a .webp file. Rehydrate it before React paints the companion
      // screen instead of asking the browser to decode that text as WebP bytes.
      (() => {
        fetch('/night-scene-static-source.webp', { cache: 'no-store' })
          .then((response) => response.ok ? response.text() : Promise.reject(new Error('background fetch failed')))
          .then((text) => {
            const base64 = String(text || '').replace(/\s+/g, '');
            if (!base64.startsWith('UklGR')) return;
            const dataUrl = `data:image/webp;base64,${base64}`;
            const probe = new Image();
            probe.onload = () => {
              document.documentElement.style.setProperty('--nekogpt-static-bg', `url("${dataUrl}")`);
            };
            probe.src = dataUrl;
          })
          .catch(() => undefined);
      })();
    </script>

    <!-- Cubism modern is loaded by src/live2d/runtime.ts from Live2D's versioned
         Core 05 endpoint. The old local Core expected a missing _em_module.wasm
         sidecar and could leave Live2DCubismCore half-initialized. -->
    <script src="/vendor/live2d/live2d.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
